version: "3.9"
services:
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on: [workflow-engine, orchestrator, ai-decision, connectors]
  workflow-engine:
    build: ./workflow-engine
    ports: ["8081:8081"]
  orchestrator:
    build: ./orchestrator
    ports: ["8082:8082"]
  ai-decision:
    build: ./ai-decision
    ports: ["8083:8083"]
  connectors:
    build: ./connectors
    ports: ["8084:8084"]
